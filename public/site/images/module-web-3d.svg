<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#250543"/>
      <stop offset="60%" stop-color="#630C66"/>
      <stop offset="100%" stop-color="#BD1874"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="20" y1="30" x2="100" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BD1874"/>
      <stop offset="100%" stop-color="#DF2C8B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#630C66" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect x="14" y="22" width="92" height="74" rx="14" fill="#630C66" opacity="0.15" transform="rotate(-3 60 59)"/>

  <!-- Main Browser Window -->
  <g filter="url(#softGlow)">
    <rect x="12" y="16" width="96" height="78" rx="12" fill="url(#bgGrad)"/>
    
    <!-- Window Header / Browser Chrome -->
    <rect x="12" y="16" width="96" height="18" rx="12" fill="#250543"/>
    <!-- Window Control Dots -->
    <circle cx="22" cy="25" r="3" fill="#FF5F56"/>
    <circle cx="30" cy="25" r="3" fill="#FFBD2E"/>
    <circle cx="38" cy="25" r="3" fill="#27C93F"/>

    <!-- URL Bar -->
    <rect x="46" y="20.5" width="54" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.15"/>
    <circle cx="51" cy="25" r="1.8" fill="#DF2C8B"/>
    <rect x="56" y="24" width="36" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.7"/>

    <!-- Browser Viewport / Web Page Canvas -->
    <rect x="16" y="32" width="88" height="58" rx="8" fill="url(#screenGrad)"/>

    <!-- Web Page Header -->
    <rect x="22" y="38" width="16" height="4" rx="2" fill="#250543"/>
    <rect x="68" y="39" width="10" height="2" rx="1" fill="#94A3B8"/>
    <rect x="81" y="39" width="10" height="2" rx="1" fill="#94A3B8"/>
    <rect x="94" y="38" width="6" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Hero Banner Card in Website -->
    <rect x="22" y="46" width="76" height="20" rx="5" fill="#250543"/>
    <rect x="27" y="51" width="34" height="3.5" rx="1.5" fill="#FFFFFF"/>
    <rect x="27" y="57" width="24" height="2" rx="1" fill="#DF2C8B"/>
    
    <!-- Mini Graphic in Banner -->
    <circle cx="86" cy="56" r="6" fill="url(#accentGrad)"/>
    <path d="M83 56L85.5 58.5L89 54" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Web Page 3 Grid Columns / Content Blocks -->
    <rect x="22" y="70" width="22" height="14" rx="3.5" fill="#EDE9FE"/>
    <rect x="25" y="73" width="10" height="2" rx="1" fill="#630C66"/>
    <rect x="25" y="77" width="16" height="1.5" rx="0.75" fill="#94A3B8"/>

    <rect x="49" y="70" width="22" height="14" rx="3.5" fill="#FCE7F3"/>
    <rect x="52" y="73" width="10" height="2" rx="1" fill="#BD1874"/>
    <rect x="52" y="77" width="16" height="1.5" rx="0.75" fill="#94A3B8"/>

    <rect x="76" y="70" width="22" height="14" rx="3.5" fill="#F1F5F9"/>
    <rect x="79" y="73" width="10" height="2" rx="1" fill="#334155"/>
    <rect x="79" y="77" width="16" height="1.5" rx="0.75" fill="#94A3B8"/>
  </g>

  <!-- Floating Mobile Device Overlay (Responsive Web) -->
  <g filter="url(#softGlow)">
    <rect x="84" y="62" width="24" height="42" rx="5" fill="#250543" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Speaker notch -->
    <rect x="92" y="64" width="8" height="1.5" rx="0.75" fill="#475569"/>
    <!-- Phone Screen -->
    <rect x="86" y="67" width="20" height="33" rx="3" fill="#FFFFFF"/>
    <!-- Phone Content -->
    <rect x="88.5" y="70" width="15" height="7" rx="1.5" fill="url(#accentGrad)"/>
    <rect x="88.5" y="79" width="15" height="2" rx="1" fill="#250543"/>
    <rect x="88.5" y="83" width="11" height="1.5" rx="0.75" fill="#94A3B8"/>
    <rect x="88.5" y="87" width="15" height="8" rx="2" fill="#F5F3FF"/>
    <circle cx="96" cy="98" r="1.2" fill="#94A3B8"/>
  </g>

  <!-- Floating Code Badge </ > -->
  <g>
    <circle cx="16" cy="74" r="10" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M13.5 71.5L10.5 74L13.5 76.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18.5 71.5L21.5 74L18.5 76.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M17 70.5L15 77.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
